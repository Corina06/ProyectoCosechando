<body>
  <div class="wrapper">
      <h1>Iniciar Sesión</h1>
      
      <form (ngSubmit)="onLogin()">  
        <div class="input-box">
          <input type="email" [(ngModel)]="email" name="email" placeholder="Correo Electronico" required />
          <i class='bx bxs-user'></i>
        </div>
        <div class="input-box">
          <input type="password"  [(ngModel)]="password" name="password" placeholder="Contraseña" required />
          <i class='bx bxs-lock-alt'></i>
        </div>
      <div class="remember-forgot">
        <label>
          <input type="checkbox">
          Recordarme
        </label>
        <a href="#"> ¿Olvidaste la contraseña?</a>
      </div>
      <!--<button type="submit" class="btn">Iniciar Sesión</button>-->
      <a class="btn" routerLink="/panel" ng-reflect-router-link="panel" href="/panel">Iniciar Sesión</a>
      
      <div class="register-link">
        <p>¿No tienes una cuenta? <a routerLink="/registro" >Regístrate</a></p>
      </div>
    </form>
  </div>
</body>
