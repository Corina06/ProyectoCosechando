<app-nav></app-nav>
<!-- Featured Section Begin -->
<section class="featured spad borde">
        <div class="row">
            <div class="col-lg-12">
                <div class="section-title">
                    <h2>Nuestros Productos</h2>
                </div>
                <div class="featured__controls">
                    <ul>
                        <li (click)="setFilter('Todos')" [class.active]="selectedFilter === 'Todos'">Todos</li>
                        <li (click)="setFilter('Frutas')" [class.active]="selectedFilter === 'Frutas'">Frutas</li>
                        <li (click)="setFilter('Legumbres')" [class.active]="selectedFilter === 'Legumbres'">Legumbres</li>
                        <li (click)="setFilter('Verduras')" [class.active]="selectedFilter === 'Verduras'">Verduras</li>
                        <li (click)="setFilter('Raíces')" [class.active]="selectedFilter === 'Raíces'">Raíces</li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="row featured__filter">
            <div *ngFor="let product of paginatedProducts" class="col-lg-3 col-md-4 col-sm-6 mix">
                <div class="featured__item">
                    <div class="featured__item__pic set-bg">
                        <img src="images/{{ product.image }}" alt="{{ product.name }}" width="100%" height="100%">
                        <ul class="featured__item__pic__hover">
                            <li><a href="#"><i class="fa fa-heart"></i></a></li>
                            <li><a routerLink="/detalleproducto" ng-reflect-router-link="detalleproducto" href="/detalleproducto"><i class="fa fa-eye"></i></a></li>
                            <li><a data-bs-toggle="modal" data-bs-target="#exampleModal"><i class="fa fa-shopping-cart"></i></a></li>
                        </ul>
                    </div>
                    <div class="featured__item__text">
                        <h6><a routerLink="/detalleproducto" ng-reflect-router-link="detalleproducto" href="/detalleproducto">{{ product.name}}</a></h6>
                        <h5>${{ product.price.toFixed(2) }}</h5>
                    </div>
                </div>
            </div>

        </div>

        <div class="product__pagination">
            <button (click)="previousPage()" [disabled]="currentPage === 1">Anterior</button>
            <span>Página {{ currentPage }} de {{ totalPages }}</span>
            <button (click)="nextPage()" [disabled]="currentPage === totalPages">Siguiente</button>
        </div>
    
</section>
<!-- Featured Section End -->


  
  <!-- Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Mensaje</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <p>Se ha añadido el producto al carrito</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-success" data-bs-dismiss="modal">Continuar Comprando</button>
          <a class="btn btn-success" routerLink="/carrito" ng-reflect-router-link="carrito" href="/carrito">Ver Carrito</a>
        </div>
      </div>
    </div>
  </div>
