<app-navcomer></app-navcomer>

<div class="text-center mb-4">
    <h2 class="display-4 font-weight-bold ">Ordenes</h2>
    <p class="lead text-muted">Pedidos que impulsan tu crecimiento.</p>
  </div>

  <div class="filters">
    <div class="filter-group">
        <label for="statusFilter">Filtrar por estado:</label>
        <select id="statusFilter" [(ngModel)]="selectedStatus" (change)="filterOrders()" class="filter-select">
            <option value="">Todos</option>
            <option value="Entregado">Entregado</option>
            <option value="Pendiente">Pendiente</option>
            <option value="No Retirado">No Retirado</option>
        </select>
    </div>
</div>

<div class="card shadow border-0 mb-7">
    <div class="table-responsive">
        <table class="table table-hover table-nowrap" id="ordersTable">
            <thead class="thead-light">
                <tr>
                    <th>Nombre</th>
                    <th>Fecha</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let order of filteredOrders">
                    <td><a class="text-heading font-semibold">{{order.name}}</a></td>
                    <td>{{order.date}}</td>
                    <td>${{order.total.toFixed(2)}}</td>
                    <td>
                        <span class="badge badge-lg badge-dot">
                            <i [ngClass]="{
                                'bg-success': order.status === 'Entregado',
                                'bg-warning': order.status === 'Pendiente',
                                'bg-danger': order.status === 'No Retirado'
                              }"></i>{{ order.status }}
                        </span>
                    </td>
                    <td class="text-end">
                        <a href="#" class="btn btn-sm btn-neutral">Ver Detalles</a>
                        <button type="button" class="btn btn-sm btn-square btn-neutral text-danger-hover">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="card-footer border-0 py-5">
        <span class="text-muted text-sm">Mostrar 10 pedidos de 250 resultados</span>
    </div>
</div>
