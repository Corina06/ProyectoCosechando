<app-navcomer></app-navcomer>

    <div class="row jumbotron box8">
      <!-- Parte superior con foto y nombre completo -->
      <div class="col-12 text-center">
        <!-- Foto del Comerciante -->
        <div class="profile-photo mb-3">
            <!-- Mostrar la foto del comerciante si existe, de lo contrario, mostrar la foto por defecto -->
            <img *ngIf="comerciante.foto; else defaultImage" [src]="comerciante.foto" alt="Foto de perfil" class="img-fluid rounded-circle" style="width: 150px; height: 150px;">
            
            <ng-template #defaultImage>
              <!-- Foto predeterminada si no hay foto -->
              <img src="/images/avatar.jpg" alt="Foto de perfil por defecto" class="img-fluid rounded-circle" style="width: 150px; height: 150px;">
            </ng-template>
        </div>
          
        <!-- Nombre completo -->
        <h2 style="margin-top: 10px;">{{ comerciante.nombre }} {{ comerciante.apellido }}</h2>
      </div>
  
      <h5 class="col-12">Datos Personales</h5>
      <form #perfilForm="ngForm" (ngSubmit)="saveChanges(perfilForm)">
        <div class="row">
          <!-- Nombre -->
          <div class="col-sm-12 col-md-6 form-group">
            <label for="nombre">Nombre</label>
            <input type="text" class="form-control" [(ngModel)]="comerciante.nombre" name="nombre" id="nombre" [readonly]="!isEditing" placeholder="Ingrese su nombre" required #nombre="ngModel" (ngModelChange)="onFormChange()">
          </div>
  
          <!-- Apellido -->
          <div class="col-sm-12 col-md-6 form-group">
            <label for="apellido">Apellido</label>
            <input type="text" class="form-control" [(ngModel)]="comerciante.apellido" name="apellido" id="apellido" [readonly]="!isEditing" placeholder="Ingrese su apellido" required #apellido="ngModel" (ngModelChange)="onFormChange()">
          </div>
  
          <!-- Correo Electrónico -->
          <div class="col-sm-12 col-md-6 form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" class="form-control" [(ngModel)]="comerciante.email" name="email" id="email" [readonly]="!isEditing" placeholder="Ingrese su correo electrónico" required email #emailField="ngModel" (ngModelChange)="onFormChange()">
          </div>
  
          <!-- Dirección -->
          <div class="col-sm-12 col-md-6 form-group">
            <label for="direccion">Dirección</label>
            <input type="text" class="form-control" [(ngModel)]="comerciante.direccion" name="direccion" id="direccion" [readonly]="!isEditing" placeholder="Distrito, Corregimiento, Calle, Casa" required #direccion="ngModel" (ngModelChange)="onFormChange()">
          </div>
  
          <!-- Nombre del Puesto -->
          <div class="col-sm-12 col-md-6 form-group">
            <label for="local">Nombre del Puesto</label>
            <input type="text" class="form-control" [(ngModel)]="comerciante.local" name="local" id="local" [readonly]="!isEditing" placeholder="Nombre de su local" required #local="ngModel" (ngModelChange)="onFormChange()">
          </div>
  
          <!-- Ubicación -->
          <div class="col-sm-12 col-md-6 form-group">
            <label for="puesto">Ubicación del Puesto</label>
            <input type="text" class="form-control" [(ngModel)]="comerciante.puesto" name="puesto" id="puesto" [readonly]="!isEditing" placeholder="¿Cómo llegar a su local?" required #puesto="ngModel" (ngModelChange)="onFormChange()">
          </div>
  
          <!-- Celular -->
          <div class="col-sm-12 col-md-6 form-group">
            <label for="celular">Celular</label>
            <input type="tel" class="form-control" [(ngModel)]="comerciante.celular" name="celular" id="celular" [readonly]="!isEditing" placeholder="Número de Contacto" required pattern="^[0-9]{8}$" #celularField="ngModel" (ngModelChange)="onFormChange()">
          </div>
  
          <!-- Fecha de Nacimiento -->
          <div class="col-sm-12 col-md-6 form-group">
            <label for="fecha">Fecha de Nacimiento</label>
            <input type="date" class="form-control" [(ngModel)]="comerciante.fecha" name="fecha" id="fecha" [readonly]="!isEditing" required #fechaField="ngModel" (ngModelChange)="onFormChange()">
          </div>
        </div>
  
        <h5 class="col-12">Datos Bancarios</h5>
        <div class="row">
          <!-- Nombre del Banco -->
          <div class="col-sm-12 col-md-6 form-group">
            <label for="banco">Nombre del Banco</label>
            <input type="text" class="form-control" [(ngModel)]="comerciante.banco" name="banco" id="banco" [readonly]="!isEditing" placeholder="Ingrese el nombre del banco" required #bancoField="ngModel" (ngModelChange)="onFormChange()">
          </div>
  
          <!-- Tipo de Cuenta -->
          <div class="col-sm-12 col-md-6 form-group">
            <label for="tipo">Tipo de Cuenta</label>
            <select id="tipo" class="form-control" [(ngModel)]="comerciante.tipo" name="tipo" [disabled]="!isEditing" #tipoField="ngModel" (ngModelChange)="onFormChange()">
              <option value="ahorro">Ahorro</option>
              <option value="corriente">Corriente</option>
            </select>
          </div>
  
          <!-- Número de Cuenta -->
          <div class="col-sm-12 col-md-6 form-group">
            <label for="cuenta">Número de Cuenta</label>
            <input type="text" class="form-control" [(ngModel)]="comerciante.cuenta" name="cuenta" id="cuenta" [readonly]="!isEditing" placeholder="Ingrese su número de cuenta" required pattern="^[0-9]+$" #cuentaField="ngModel" (ngModelChange)="onFormChange()">
          </div>
  
          <!-- Contraseña -->
          <div class="col-sm-12 col-md-6 form-group">
            <label for="password">Contraseña</label>
            <input type="password" class="form-control" [(ngModel)]="comerciante.password" name="password" id="password" [readonly]="!isEditing" placeholder="Ingrese su contraseña" required #passwordField="ngModel" (ngModelChange)="onFormChange()">
          </div>
        </div>
  
        <!-- Botón Guardar/Actualizar -->
        <div class="col-sm-12 form-group mb-0 text-center">
          <br>
          <button *ngIf="isEditing" type="submit" class="btn btn-save" [disabled]="!perfilForm.dirty">Guardar Cambios</button>
          <button *ngIf="!isEditing" type="button" class="btn btn-edit" (click)="toggleEdit()">Editar</button>
        </div>
      </form>
    </div>

  <br><br>

  <!-- Mensaje de confirmación -->
<div *ngIf="changesSaved" class="alert alert-success text-center mt-3">
    <strong>{{ successMessage }}</strong>
  </div>
