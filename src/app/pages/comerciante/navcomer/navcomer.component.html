<header>
  <!-- Comerciante-->
  <nav class="header"> 
        <ul class="nav">
            
            <li><a href="https://www.cadenadefrio.com.pa/Merca-Panama-1"><img src="images/Merca.png" width="15px"></a></li>
                    <li><a href="https://www.facebook.com/cadenadefriopa/"><i class="bi bi-facebook"></i></a></li>
                    <li><a href="https://www.instagram.com/cadenadefriopa/"><i class="bi bi-instagram"></i></a></li>
                    <li><a href="https://twitter.com/cadenadefriopa"><i class="bi bi-twitter"></i></a></li>
                    <li><a href="https://www.youtube.com/channel/UCsTuabeM_mAcdWnPRxXKicQ"><i class="bi bi-youtube"></i></a></li>
                    <li><a href=""><i class="bi bi-envelope-fill"></i> cosechando&#64;gmail.com</a></li>
        </ul>
  </nav>

  <div class="container">
    <!-- logo -->
    <a routerLink="/inicio" routerLinkActive="router-link-active">
      <img src="images/Icono.png" (click)="navigateToInicio()" alt="Logotipo" width="60px">
    </a>
    <h1 class="h2 mb-0 ls-tight">Bienvenido Comerciante</h1>
    
    <div class="iconos">
      <!-- Ícono de notificación con dropdown -->
      <div class="cart-link" (click)="toggleNotifications()">
        <i class="fas fa-bell"></i>
      </div>
  
      <!-- Panel de notificaciones que se muestra/oculta -->
      <div class="notifications-panel" *ngIf="notificationsVisible">
        <ul>
          <li *ngFor="let notification of notifications">
            <div class="notification-item">
              <div class="notification-content">
                <i class="fas fa-info-circle"></i> 
                {{ notification }}
              </div>
            </div>
          </li>
        </ul>
      </div>
  
      <!-- Ícono de perfil con dropdown -->
      <div class="cart-link" (click)="toggleProfileMenu()">
        <i class="fas fa-user"></i>
      </div>
  
      <!-- Panel de opciones de perfil -->
      <div class="profile-panel" *ngIf="profileMenuVisible">
        <ul>
          <li (click)="goToProfile()">
            <i class="fas fa-user-circle"></i> Perfil
          </li>
          <li (click)="logout()">
            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
          </li>
        </ul>
      </div>
    </div>
  </div>
  
  
  

  <nav class="nav-categories"> 
    <ul class="nav">
        <li class="nav-link">
            <a class="" routerLink="/panel" ng-reflect-router-link="panel" href="/panel">Reporte</a>
        </li>
        <li class="nav-link">
            <a  routerLink="/producto" ng-reflect-router-link="producto" href="/productos">Productos</a>
        </li>
        <li class="nav-link">
            <a  routerLink="/orden" ng-reflect-router-link="orden" href="/orden">Ordenes</a>
        </li>
        <li class="nav-link">
            <a  routerLink="/inventario" ng-reflect-router-link="inventario" href="/inventario">Inventario</a>
        </li>
    </ul>
  </nav>
</header>
