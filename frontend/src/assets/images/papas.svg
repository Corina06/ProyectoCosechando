<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="potatoGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#DEB887;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#CD853F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B7355;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Fondo -->
  <rect width="400" height="300" fill="#F0F8E8"/>
  
  <!-- Papa principal -->
  <ellipse cx="200" cy="150" rx="80" ry="50" fill="url(#potatoGradient)"/>
  
  <!-- Papas más pequeñas -->
  <ellipse cx="120" cy="180" rx="40" ry="25" fill="url(#potatoGradient)"/>
  <ellipse cx="280" cy="120" rx="35" ry="22" fill="url(#potatoGradient)"/>
  <ellipse cx="300" cy="180" rx="30" ry="20" fill="url(#potatoGradient)"/>
  
  <!-- Detalles de textura -->
  <circle cx="180" cy="140" r="3" fill="#8B7355"/>
  <circle cx="220" cy="160" r="2" fill="#8B7355"/>
  <circle cx="200" cy="170" r="2" fill="#8B7355"/>
  <circle cx="110" cy="170" r="2" fill="#8B7355"/>
  <circle cx="290" cy="110" r="2" fill="#8B7355"/>
  
  <!-- Texto -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2F4F2F" text-anchor="middle">Papas Frescas</text>
  <text x="200" y="275" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">Versátiles para freír, hervir o hacer puré</text>
</svg>