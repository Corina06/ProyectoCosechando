<div class="product__pagination">
    <!-- Botón de "Anterior" con solo el ícono -->
    <button (click)="previousPage()" [disabled]="currentPage === 1" class="pagination-button">
      <i class="fas fa-chevron-left"></i>  <!-- Ícono de flecha izquierda -->
    </button>
    
    <!-- Información de la página en formato "1 de 2" -->
    <span class="page-info">{{ currentPage }} de {{ totalPages }}</span>
    
    <!-- Botón de "Siguiente" con solo el ícono -->
    <button (click)="nextPage()" [disabled]="currentPage === totalPages" class="pagination-button">
      <i class="fas fa-chevron-right"></i>  <!-- Ícono de flecha derecha -->
    </button>
  </div>
